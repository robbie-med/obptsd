<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L&amp;D Night — OB Floor Sim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101820'/%3E%3Cpath d='M3 18h6l2-6 3 12 3-16 3 10h9' fill='none' stroke='%2350e3a4' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo">⌁</span> L&amp;D Night</div>
    <div id="clock" class="clock">19:00</div>
    <div id="speed" class="speed">
      <button data-speed="0" title="Pause (space)">❚❚</button>
      <button data-speed="1" title="Real time">1×</button>
      <button data-speed="10">10×</button>
      <button data-speed="60">60×</button>
      <button data-speed="240">240×</button>
      <button data-speed="skip" title="Fast-forward until the next page (N)">⏭ next page</button>
    </div>
    <div id="floorstats" class="floorstats"></div>
    <div class="topright">
      <label class="toggle" title="Show the hidden truth (teaching mode)"><input type="checkbox" id="teach"> truth</label>
      <label class="toggle" title="Drop to 1× when something urgent happens"><input type="checkbox" id="autoslow" checked> auto-slow</label>
      <label class="toggle" title="Sound for urgent pages"><input type="checkbox" id="sound"> sound</label>
      <label class="toggle" title="Hear the room: the Doppler at whatever rate the monitor is printing, plus the monitor and pumps when you walk in"><input type="checkbox" id="fhrAudio"> ♥ room audio</label>
      <button id="endBtn" class="ghost" title="End the shift now and see the debrief">End shift</button>
      <button id="menuBtn" class="ghost">Menu</button>
    </div>
  </header>

  <main id="main">
    <aside id="board"></aside>
    <section id="center">
      <div id="emerg" class="hidden"></div>
      <div id="ptHeader"></div>
      <div id="stripWrap">
        <canvas id="strip"></canvas>
        <div id="stripControls">
          <select id="stripWindow" title="Paper window">
            <option value="paper">Paper speed (3 cm/min)</option>
            <option value="20">20 min</option>
            <option value="40">40 min</option>
            <option value="90">90 min</option>
          </select>
          <button id="liveBtn" class="ghost small">● LIVE</button>
          <span id="stripInfo"></span>
        </div>
      </div>
      <div id="vitalsBar"></div>
      <div id="orderBox">
        <div class="orderRow">
          <input id="orderInput" list="orderHints" autocomplete="off" spellcheck="false" placeholder="Order… e.g. “pit up 2”, “labetalol 20 mg IV”, “mag 4 g load then 2 g/h”, “c-section stat”">
          <datalist id="orderHints"></datalist>
          <button id="orderGo">Order</button>
        </div>
        <div id="orderPreview"></div>
        <div id="quick"></div>
        <div id="bedsideLog" title="What you see and hear on the floor (not on the phone)"></div>
      </div>
      <div id="chartTabs" class="tabs"></div>
      <div id="chart"></div>
    </section>
    <aside id="comms">
      <div class="phone">
        <div class="phoneTop"><span>HospNet ▂▄▆</span><span id="phoneClock"></span><span>🔋23%</span>
          <button id="phoneToggle" class="ghost small" title="Put the phone in your pocket (P)">▾</button></div>
        <div id="phoneMini" title="Take out your phone (P)">📱<span id="phoneBadge" class="badge hidden"></span><div id="phoneMiniFrom"></div></div>
        <div class="commsHead">
          <span>SecureChat<sup>™</sup></span>
          <span class="filters">
            <button data-filter="all" class="on">All</button>
            <button data-filter="pt">This pt</button>
            <button data-filter="urgent">Urgent</button>
          </span>
        </div>
        <div id="login" class="hidden"></div>
        <div id="feed"></div>
      </div>
    </aside>
  </main>
  <div id="banner" class="hidden"></div>
</div>

<div id="overlay" class="overlay"></div>
<script type="module" src="js/ui/app.js"></script>
</body>
</html>
