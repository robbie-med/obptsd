<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L&amp;D Night — OB Floor Sim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101820'/%3E%3Cpath d='M3 18h6l2-6 3 12 3-16 3 10h9' fill='none' stroke='%2350e3a4' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0b1016;
  --panel: #121a23;
  --panel2: #18222d;
  --line: #233142;
  --line2: #2e3f53;
  --text: #d8e0e8;
  --muted: #8494a5;
  --dim: #5c6b7b;
  --green: #4fe0a0;
  --amber: #f3b54a;
  --red: #ff5f5f;
  --blue: #6db7ff;
  --violet: #c4a0ff;
  --pink: #ff8fc7;
  --paper: #fbf7ee;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: 0.4; cursor: default; }
button.ghost { background: transparent; }
button.small { padding: 2px 7px; font-size: 12px; }
button.on { background: #1f3b31; border-color: var(--green); color: var(--green); }
button.danger { border-color: #7a2c2c; background: #2a1414; color: #ffb0b0; }
input, select, textarea { font: inherit; color: var(--text); background: #0e151d; border: 1px solid var(--line2); border-radius: 6px; padding: 5px 8px; }
input:focus, select:focus { outline: none; border-color: var(--green); }
.hidden { display: none !important; }

#app { display: flex; flex-direction: column; height: 100vh; }
#topbar { display: flex; align-items: center; gap: 14px; padding: 6px 12px; background: #0f161e; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: 0.3px; color: var(--green); white-space: nowrap; }
.brand .logo { display: inline-block; transform: scale(1.4); margin-right: 4px; }
.clock { font: 600 22px var(--mono); color: #fff; min-width: 74px; }
.speed { display: flex; gap: 3px; }
.speed button { padding: 3px 8px; font-family: var(--mono); font-size: 12px; }
.floorstats { display: flex; gap: 12px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.floorstats b { color: var(--text); font-weight: 600; }
.floorstats .busy { color: var(--amber); }
.floorstats .bad { color: var(--red); }
.topright { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.toggle { color: var(--muted); font-size: 12px; display: flex; gap: 4px; align-items: center; cursor: pointer; user-select: none; }

#main { flex: 1; display: grid; grid-template-columns: 330px minmax(560px, 1fr) 380px; min-height: 0; }
#board, #comms { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
#comms { border-right: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
#center { overflow-y: auto; padding: 8px 12px 30px; min-width: 0; }

/* ---------- board */
.bsec { padding: 8px 8px 2px; }
.bsec h3 { margin: 4px 4px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); display: flex; justify-content: space-between; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 5px; margin-bottom: 6px; cursor: pointer; position: relative; }
.card:hover { border-color: var(--line2); }
.card.sel { border-color: var(--green); box-shadow: 0 0 0 1px var(--green) inset; }
.card.empty { cursor: default; color: var(--dim); padding: 5px 8px; font-size: 12px; background: transparent; border-style: dashed; }
.card .r1 { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.card .room { font: 600 12px var(--mono); color: var(--muted); }
.card .nm { font-weight: 600; }
.card .meta { color: var(--muted); font-size: 12px; }
.card .st { font-size: 12px; margin-top: 1px; color: #b8c6d4; }
.card .tags { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 2px; }
.tag { font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: #223040; color: #a9bccf; white-space: nowrap; }
.tag.red { background: #3b1d22; color: #ff9ea3; }
.tag.amber { background: #3a2d14; color: #ffd27a; }
.tag.green { background: #163329; color: #7debb8; }
.tag.blue { background: #15283d; color: #9ccdff; }
.tag.violet { background: #2a2140; color: #d2bcff; }
.card canvas { display: block; width: 100%; height: 38px; margin-top: 4px; border-radius: 3px; }
.badge { position: relative; top: -1px; margin-left: 4px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 8px; }
.badge.lo { background: #3d5268; }
.truth { color: var(--pink); font-family: var(--mono); font-size: 11px; }
.resline { font-size: 12px; color: var(--muted); padding: 2px 4px; }
.resline b { color: var(--text); }

/* ---------- center */
#emerg { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
#emerg.hidden { display: none; }
.em { border: 1px solid var(--red); background: #2a0f14; border-radius: 8px; padding: 8px 10px; cursor: pointer; animation: empulse 1.2s ease-in-out infinite; }
.em.post { border-color: var(--amber); background: #261d10; animation: none; }
.emh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.emh b { color: #ffd6d6; letter-spacing: 0.04em; }
.em.post .emh b { color: #ffe2b0; }
.emclock { font-family: var(--mono); font-size: 22px; font-weight: 700; color: #fff; margin-left: auto; }
.emsub { color: var(--muted); font-size: 11px; }
.emline { font-size: 12px; color: #f0c8c8; margin: 4px 0 6px; }
.em.post .emline { color: #eedcb8; }
.emb { display: flex; flex-wrap: wrap; gap: 4px; }
.emb button { font-size: 12px; padding: 3px 8px; background: #3a1820; border-color: #7a2c2c; }
@keyframes empulse { 0%, 100% { box-shadow: 0 0 0 0 #ff5f5f00; } 50% { box-shadow: 0 0 0 3px #ff5f5f55; } }
#ptHeader { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
#ptHeader .big { font-size: 18px; font-weight: 700; }
#ptHeader .sub { color: var(--muted); }
#stripWrap { position: relative; background: var(--paper); border-radius: 6px; overflow: hidden; border: 1px solid #3a2d2a; }
#strip { display: block; width: 100%; height: 430px; cursor: grab; }
#strip:active { cursor: grabbing; }
#stripControls { display: flex; gap: 8px; align-items: center; padding: 5px 8px; background: #1a1412; color: #d9c9c3; font-size: 12px; }
#stripControls select { background: #2a201d; border-color: #4a3a35; color: #e8d8d0; padding: 2px 6px; }
#stripControls #stripInfo { margin-left: auto; font-family: var(--mono); color: #bfa79e; }
#liveBtn.live { color: #ff6b6b; border-color: #ff6b6b; }
#vitalsBar { display: flex; gap: 14px; flex-wrap: wrap; padding: 7px 4px; font-family: var(--mono); font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
#vitalsBar b { color: var(--text); }
#vitalsBar .hot { color: var(--red); }
#orderBox { padding: 8px 0 4px; }
.orderRow { display: flex; gap: 6px; }
#orderInput { flex: 1; font-family: var(--mono); font-size: 13px; padding: 7px 10px; }
#orderGo { background: #1f3b31; border-color: var(--green); color: var(--green); font-weight: 600; }
#orderPreview { min-height: 18px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 3px 2px; }
#orderPreview.err { color: var(--amber); }
#quick { display: flex; flex-wrap: wrap; gap: 4px; }
#quick button { font-size: 12px; padding: 3px 8px; }
#quick .sep { width: 8px; }
#quick button.cs { border-color: #7a2c2c; color: #ffb0b0; }
.tabs { display: flex; gap: 2px; margin-top: 10px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-radius: 6px 6px 0 0; background: transparent; color: var(--muted); padding: 5px 12px; }
.tabs button.on { background: var(--panel2); color: var(--text); }
#chart { background: var(--panel2); border-radius: 0 0 8px 8px; padding: 10px 12px; min-height: 160px; }
#chart table { width: 100%; border-collapse: collapse; font-size: 12px; }
#chart th { text-align: left; color: var(--dim); font-weight: 500; border-bottom: 1px solid var(--line); padding: 3px 6px; }
#chart td { padding: 3px 6px; border-bottom: 1px solid #1d2935; vertical-align: top; }
#chart td.mono, .mono { font-family: var(--mono); }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 3px 10px; font-size: 12.5px; }
.kv .k { color: var(--dim); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.st-done { color: var(--green); } .st-held_nurse, .st-held_pharmacy { color: var(--amber); } .st-rejected, .st-cancelled { color: var(--dim); text-decoration: line-through; } .st-pending { color: var(--blue); }
.truthbox { margin-top: 10px; border: 1px dashed #7a3d61; border-radius: 6px; padding: 8px 10px; background: #1d1220; }
.truthbox h4 { margin: 0 0 6px; color: var(--pink); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

/* ---------- comms */
.commsHead { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: 600; position: sticky; top: 0; background: var(--panel); z-index: 1; }
.filters button { font-size: 11px; padding: 1px 7px; }
#feed { padding: 6px 8px; flex: 1; }
.msg { border-left: 3px solid var(--line2); background: var(--panel2); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
.msg.unread { box-shadow: 0 0 0 1px #2c4258 inset; }
.msg .mh { display: flex; gap: 6px; align-items: baseline; font-size: 11.5px; color: var(--muted); }
.msg .mh .from { font-weight: 600; }
.msg .mh .rm { font-family: var(--mono); background: #223040; color: #b9cbe0; padding: 0 5px; border-radius: 4px; cursor: pointer; }
.msg .mh .time { margin-left: auto; font-family: var(--mono); }
.msg .mt { margin-top: 2px; white-space: pre-wrap; }
.msg .ma { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.msg .ma button { font-size: 11.5px; padding: 2px 8px; }
.msg.p0 { opacity: 0.78; }
.msg.p0 .mt { color: #aab7c4; font-size: 12px; }
.msg.p2 { border-left-color: var(--amber); }
.msg.p3 { border-left-color: var(--red); background: #241418; }
.msg.resolved .ma { display: none; }
.msg.chosen .ma { display: none; }
.role-nurse .from { color: #8fd4ff; }
.role-pharmacy .from { color: var(--violet); }
.role-anesthesia .from { color: #7fe3d0; }
.role-lab .from { color: #c9d36a; }
.role-charge .from { color: #ffb37a; }
.role-md .from { color: var(--green); }
.role-family .from, .role-phone .from { color: var(--pink); }
.role-delivery .from { color: #ffd86b; }
.role-handoff .from { color: #ffd86b; }

#banner { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); background: #3b1218; border: 1px solid var(--red); color: #ffd6d6; padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 20; max-width: 640px; box-shadow: 0 8px 30px #000a; cursor: pointer; animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px #ff5f5f44, 0 8px 30px #000a; } }

/* ---------- overlay (menu, debrief, dialogs) */
.overlay { position: fixed; inset: 0; background: #05080bcc; backdrop-filter: blur(3px); display: none; z-index: 50; overflow-y: auto; }
.overlay.show { display: block; }
.dlg { max-width: 980px; margin: 40px auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; padding: 22px 26px; box-shadow: 0 20px 60px #000c; }
.dlg.narrow { max-width: 560px; }
.dlg h1 { margin: 0 0 4px; font-size: 26px; color: var(--green); }
.dlg h2 { margin: 18px 0 8px; font-size: 16px; }
.dlg p { color: #b4c1ce; }
.dlg .lead { color: var(--muted); margin-top: 0; }
.modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 14px 0; }
.mode { border: 1px solid var(--line2); border-radius: 10px; padding: 12px; cursor: pointer; background: var(--panel2); }
.mode.on { border-color: var(--green); box-shadow: 0 0 0 1px var(--green) inset; }
.mode b { display: block; margin-bottom: 3px; }
.mode span { color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.btnrow { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.big-btn { font-size: 15px; padding: 9px 20px; background: #1f3b31; border-color: var(--green); color: var(--green); font-weight: 700; }
.help { font-size: 12.5px; color: #aab8c6; columns: 2; column-gap: 26px; }
.help p { margin: 0 0 8px; break-inside: avoid; }
.help code { font-family: var(--mono); color: #e6eef6; background: #1d2834; padding: 0 4px; border-radius: 3px; }
.scorebig { display: flex; gap: 24px; align-items: center; margin: 10px 0 4px; }
.scorebig .grade { font-size: 64px; font-weight: 800; line-height: 1; }
.scorebig .num { font-size: 28px; font-weight: 700; }
.pen { font-size: 12.5px; }
.pen td { padding: 2px 8px; border-bottom: 1px solid var(--line); }
.pen td.pts { color: var(--red); font-family: var(--mono); text-align: right; }
.dcard { border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; margin: 12px 0; background: var(--panel2); }
.dcard h3 { margin: 0 0 4px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dcard canvas { width: 100%; height: 210px; display: block; background: #0d141b; border-radius: 6px; margin: 6px 0; }
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 12px; }
.dgrid ul { margin: 2px 0; padding-left: 16px; }
.cmp td { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; }
.cmp .off { color: var(--amber); }
.cmp .way { color: var(--red); }
.legend { font-size: 11px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
.labpanel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 14px; padding: 8px; background: var(--panel2); border-radius: 8px; margin-top: 8px; }
.labpanel label { font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.labpanel input[type=range] { padding: 0; }
.cs-dlg select { width: 100%; }
@media (max-width: 1280px) {
  #main { grid-template-columns: 280px minmax(480px, 1fr) 320px; }
}

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo">⌁</span> L&amp;D Night</div>
    <div id="clock" class="clock">19:00</div>
    <div id="speed" class="speed">
      <button data-speed="0" title="Pause (space)">❚❚</button>
      <button data-speed="1" title="Real time">1×</button>
      <button data-speed="10">10×</button>
      <button data-speed="60">60×</button>
      <button data-speed="240">240×</button>
      <button data-speed="skip" title="Fast-forward until the next page (N)">⏭ next page</button>
    </div>
    <div id="floorstats" class="floorstats"></div>
    <div class="topright">
      <label class="toggle" title="Show the hidden truth (teaching mode)"><input type="checkbox" id="teach"> truth</label>
      <label class="toggle" title="Drop to 1× when something urgent happens"><input type="checkbox" id="autoslow" checked> auto-slow</label>
      <label class="toggle" title="Sound for urgent pages"><input type="checkbox" id="sound"> sound</label>
      <button id="endBtn" class="ghost" title="End the shift now and see the debrief">End shift</button>
      <button id="menuBtn" class="ghost">Menu</button>
    </div>
  </header>

  <main id="main">
    <aside id="board"></aside>
    <section id="center">
      <div id="emerg" class="hidden"></div>
      <div id="ptHeader"></div>
      <div id="stripWrap">
        <canvas id="strip"></canvas>
        <div id="stripControls">
          <select id="stripWindow" title="Paper window">
            <option value="paper">Paper speed (3 cm/min)</option>
            <option value="20">20 min</option>
            <option value="40">40 min</option>
            <option value="90">90 min</option>
          </select>
          <button id="liveBtn" class="ghost small">● LIVE</button>
          <span id="stripInfo"></span>
        </div>
      </div>
      <div id="vitalsBar"></div>
      <div id="orderBox">
        <div class="orderRow">
          <input id="orderInput" list="orderHints" autocomplete="off" spellcheck="false" placeholder="Order… e.g. “pit up 2”, “labetalol 20 mg IV”, “mag 4 g load then 2 g/h”, “c-section stat”">
          <datalist id="orderHints"></datalist>
          <button id="orderGo">Order</button>
        </div>
        <div id="orderPreview"></div>
        <div id="quick"></div>
      </div>
      <div id="chartTabs" class="tabs"></div>
      <div id="chart"></div>
    </section>
    <aside id="comms">
      <div class="commsHead">
        <span>Pages &amp; calls</span>
        <span class="filters">
          <button data-filter="all" class="on">All</button>
          <button data-filter="pt">This pt</button>
          <button data-filter="urgent">Urgent</button>
        </span>
      </div>
      <div id="feed"></div>
    </aside>
  </main>
  <div id="banner" class="hidden"></div>
</div>

<div id="overlay" class="overlay"></div>
